<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Inbox | Usha Sree Portfolio</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <link rel="stylesheet" href="style.css" />
  <style>
    .admin-container {
      max-width: 960px;
      margin: 40px auto;
      padding: 0 24px;
    }
    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
      flex-wrap: wrap;
      gap: 16px;
    }
    .stats-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin-bottom: 36px;
    }
    .stat-box {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 24px;
      box-shadow: var(--shadow-sm);
    }
    .stat-box h4 {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }
    .stat-box .stat-num {
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--accent);
    }
    .message-card {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 24px;
      margin-bottom: 18px;
      box-shadow: var(--shadow-sm);
      transition: transform 0.2s ease;
    }
    .message-card:hover {
      box-shadow: var(--shadow-md);
    }
    .msg-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
      flex-wrap: wrap;
      gap: 8px;
    }
    .msg-sender h3 {
      font-size: 1.15rem;
      font-weight: 700;
    }
    .msg-sender a {
      font-size: 0.88rem;
      color: var(--accent);
      font-weight: 500;
    }
    .msg-date {
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .msg-body {
      background: var(--bg-subtle);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 16px;
      font-size: 0.95rem;
      color: var(--text-primary);
      margin-bottom: 16px;
      white-space: pre-wrap;
    }
    .msg-actions {
      display: flex;
      gap: 12px;
    }
    .btn-delete {
      background-color: #fef2f2;
      color: #dc2626;
      border: 1px solid #fecaca;
    }
    .btn-delete:hover {
      background-color: #fee2e2;
    }
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      background: #ffffff;
      border: 1px dashed var(--border-color);
      border-radius: var(--radius-md);
    }
  </style>
</head>
<body style="background-color: var(--bg-subtle);">

  <header class="navbar">
    <div class="container nav-container">
      <a href="/" class="logo">Usha Sree<span>.db</span></a>
      <a href="/" class="btn btn-secondary btn-sm">
        <i data-lucide="arrow-left"></i> Back to Portfolio
      </a>
    </div>
  </header>

  <main class="admin-container">
    <div class="admin-header">
      <div>
        <h1 style="font-size: 2.2rem; font-weight: 800; margin-bottom: 4px;">Recruiter Messages Inbox</h1>
        <p style="color: var(--text-secondary);">Direct inquiries submitted from your portfolio contact form (Stored in SQLite: <code>portfolio.db</code>)</p>
      </div>
      <button class="btn btn-secondary btn-sm" onclick="loadInbox()">
        <i data-lucide="refresh-cw"></i> Refresh
      </button>
    </div>

    <!-- Quick Stats -->
    <div class="stats-row">
      <div class="stat-box">
        <h4>Total Messages Received</h4>
        <div class="stat-num" id="total-messages-count">0</div>
      </div>
      <div class="stat-box">
        <h4>Total Portfolio Views</h4>
        <div class="stat-num" id="total-views-count">0</div>
      </div>
    </div>

    <!-- Messages Container -->
    <div id="messages-list">
      <div class="empty-state">Loading inquiries from database...</div>
    </div>
  </main>

  <script>
    const API_BASE = "";

    async function loadInbox() {
      const listEl = document.getElementById("messages-list");
      const msgCountEl = document.getElementById("total-messages-count");
      const viewCountEl = document.getElementById("total-views-count");

      try {
        // Fetch stats
        const statsRes = await fetch(`${API_BASE}/api/stats`);
        if (statsRes.ok) {
          const stats = await statsRes.json();
          if (msgCountEl) msgCountEl.textContent = stats.total_messages;
          if (viewCountEl) viewCountEl.textContent = stats.total_views;
        }

        // Fetch messages
        const res = await fetch(`${API_BASE}/api/contact`);
        if (!res.ok) throw new Error("Failed to load messages");
        const messages = await res.json();

        if (messages.length === 0) {
          listEl.innerHTML = `
            <div class="empty-state">
              <i data-lucide="inbox" style="width: 48px; height: 48px; margin-bottom: 12px; opacity: 0.5;"></i>
              <h3>No messages yet</h3>
              <p>Submitted inquiries from your portfolio will appear here.</p>
            </div>
          `;
          lucide.createIcons();
          return;
        }

        listEl.innerHTML = messages.map(msg => `
          <article class="message-card" id="msg-${msg.id}">
            <div class="msg-top">
              <div class="msg-sender">
                <h3>${escapeHtml(msg.name)}</h3>
                <a href="mailto:${escapeHtml(msg.email)}?subject=Re: Inquiring about Software Engineering Opportunity">${escapeHtml(msg.email)}</a>
              </div>
              <span class="msg-date"><i data-lucide="clock" style="width: 14px; height: 14px; vertical-align: middle;"></i> ${msg.created_at} UTC</span>
            </div>
            
            <div class="msg-body">${escapeHtml(msg.message)}</div>
            
            <div class="msg-actions">
              <a href="mailto:${escapeHtml(msg.email)}?subject=Re: Software Engineering Opportunity&body=Hi ${encodeURIComponent(msg.name)},%0D%0A%0D%0AThank you for reaching out!%0D%0A%0D%0ABest regards,%0D%0AUsha Sree Thota" class="btn btn-primary btn-sm">
                <i data-lucide="mail"></i> Reply to Recruiter
              </a>
              <button class="btn btn-delete btn-sm" onclick="deleteMessage(${msg.id})">
                <i data-lucide="trash-2"></i> Delete
              </button>
            </div>
          </article>
        `).join("");

        lucide.createIcons();

      } catch (err) {
        listEl.innerHTML = `<div class="empty-state" style="color: #dc2626;">Error loading messages from backend: ${err.message}</div>`;
      }
    }

    async function deleteMessage(id) {
      if (!confirm("Are you sure you want to delete this message from the database?")) return;
      try {
        const res = await fetch(`${API_BASE}/api/contact/${id}`, { method: "DELETE" });
        if (res.ok) {
          const card = document.getElementById(`msg-${id}`);
          if (card) card.remove();
          loadInbox();
        } else {
          alert("Failed to delete message");
        }
      } catch (err) {
        alert("Error connecting to server");
      }
    }

    function escapeHtml(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();
      loadInbox();
    });
  </script>
</body>
</html>
